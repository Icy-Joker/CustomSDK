stages:
  - build
  - publish

variables:
  SOURCE_DIR: "$CI_PROJECT_DIR/src/$CI_PROJECT_NAME"
  INSTALL_DIR: "$CI_PROJECT_DIR"
  
  CUSTOM_REGISTRY: "192.168.0.104:5000"
  CUSTOM_REGISTRY_USERNAME: "oci-username"
  CUSTOM_REGISTRY_PASSWORD: "oci-password"

cplusplus-build:linux:
  stage: build
  parallel:
    matrix:
      - RUNNER_TAG: [ "linux-x86_64","linux-aarch64" ]
        BUILD_IMAGE: "$CUSTOM_REGISTRY/common_software/cplusplus_development:latest"
  tags:
    - $RUNNER_TAG
  image:
    name: $BUILD_IMAGE
  script:
    - export SecondParty=/opt/secondparty
    - export ThirdParty=/opt/thirdparty
    - pushd "$SOURCE_DIR" >> /dev/null
    - cmake --preset "default-linux-gcc-x64"
    - cmake --build --preset "ci-linux-gcc-x64" --config "Release" --target "install" --parallel "$(nproc)"
    - popd >> "/dev/null"
  artifacts:
    paths:
      - bin
      - config
      - doc
      - examples
      - include
      - lib
      - plugins
      - thirdparty
      - tools
      - test
      - scrips
      - README.md
    expire_in: '7 days'

cplusplus-build:windows:
  stage: build
  parallel:
    matrix:
      - RUNNER_TAG: [ "windows-x86_64" ]
        BUILD_IMAGE: "$CUSTOM_REGISTRY/windows/servercore:ltsc2022"
  tags:
    - $RUNNER_TAG
  image:
    name: $BUILD_IMAGE
  script:
    - set SecondParty=XXX
    - set ThirdParty=XXX
    - pushd "$SOURCE_DIR"
    - cmake --preset "default-windows-vc140-x64"
    - cmake --build --preset "ci-windows-vc140-x64" --config "Release" --target "install" --parallel "8"
    - popd
  artifacts:
    paths:
      - bin
      - config
      - doc
      - examples
      - include
      - lib
      - plugins
      - thirdparty
      - tools
      - test
      - scrips
      - README.md
    expire_in: '7 days'

