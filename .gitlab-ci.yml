stages:
  - build
  - publish

variables:
  SOURCE_DIR: "$CI_PROJECT_DIR/src/$CI_PROJECT_NAME"
  INSTALL_DIR: "$CI_PROJECT_DIR"
  
  CUSTOM_REGISTRY: "192.168.0.104:5000"
  CUSTOM_REGISTRY_USERNAME: "oci-username"
  CUSTOM_REGISTRY_PASSWORD: "oci-password"

cplusplus-build:windows:
  stage: build
  parallel:
    matrix:
      - RUNNER_TAG: [ "windows-x86_64" ]
        BUILD_IMAGE: "$CUSTOM_REGISTRY/windows/servercore:ltsc2022"
  tags:
    - $RUNNER_TAG
  image:
    name: $BUILD_IMAGE
  script:
    - set SecondParty=XXX
    - set ThirdParty=XXX
    - pushd "$SOURCE_DIR"
    - cmake --preset "default-windows-vc140-x64"
    - cmake --build --preset "ci-windows-vc140-x64" --config "Release" --target "install" --parallel "8"
    - popd
  artifacts:
    paths:
      - bin
      - config
      - doc
      - examples
      - include
      - lib
      - plugins
      - thirdparty
      - tools
      - test
      - README.md
    expire_in: '7 days'

cplusplus-build:linux:
  stage: build
  parallel:
    matrix:
      - RUNNER_TAG: [ "linux-x86_64" ]
        BUILD_IMAGE: "$CUSTOM_REGISTRY/common_software/cplusplus_development:latest"
  tags:
    - $RUNNER_TAG
  image:
    name: $BUILD_IMAGE
  script:
    - export SecondParty=/opt/secondparty
    - export ThirdParty=/opt/thirdparty
    - pushd "$SOURCE_DIR" >> /dev/null
    - cmake --preset "default-linux-gcc-x64"
    - cmake --build --preset "ci-linux-gcc-x64" --config "Release" --target "install" --parallel "$(nproc)"
    - popd >> "/dev/null"
  artifacts:
    paths:
      - bin
      - config
      - doc
      - examples
      - include
      - lib
      - plugins
      - thirdparty
      - tools
      - test
      - README.md
    expire_in: '7 days'

oci-publish:single:
  stage: publish
  parallel:
    matrix:
      - RUNNER_TAG: [ "linux-x86_64" ]
        BUILD_PLATFORM: "linux/amd64"
        BUILD_IMAGE: "$CUSTOM_REGISTRY/moby/buildkit:rootless"
        OCI_LAYOUT_PATH: "$CI_PROJECT_DIR/oci-layout-amd64"
  #      - RUNNER_TAG: [ "linux-aarch64" ]
  #        BUILD_IMAGE: "$$CUSTOM_REGISTRY/kaniko-project/executor:debug"
  #        OCI_LAYOUT_PATH: "$CI_PROJECT_DIR/oci-layout-arm64"
  tags:
    - $RUNNER_TAG
  image:
    name: $BUILD_IMAGE
    entrypoint: [ "" ]
  needs:
    - job: cplusplus-build:linux
      artifacts: true
  script:
    - CUSTOM_IMAGE_NAMESPACE=$(echo "CommonSoftware" | tr '[:upper:]' '[:lower:]')
    - CUSTOM_IMAGE_NAME=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
    # 执行 Kaniko 构建并推送镜像
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt platform=linux/amd64
      --output type=oci,dest="$CI_PROJECT_DIR/image-amd64.tar"
  artifacts:
    paths:
      - $OCI_LAYOUT_PATH
    expire_in: '7 days'

oci-publish:multi:
  stage: publish
  needs:
    - job: oci-publish:single
      artifacts: true
  parallel:
    matrix:
      - RUNNER_TAG: [ "linux-x86_64" ]
        BUILD_IMAGE: "$CUSTOM_REGISTRY/regclient/regctl:alpine"
        OCI_LAYOUT_PATH_AMD64: "$CI_PROJECT_DIR/oci-layout-amd64"
        OCI_LAYOUT_PATH_ARM64: "$CI_PROJECT_DIR/oci-layout-arm64"
        OCI_LAYOUT_PATH_MULTI: "$CI_PROJECT_DIR/oci-layout-multi"
  tags:
    - $RUNNER_TAG
  image:
    name: $BUILD_IMAGE
    entrypoint: [ "" ]
  script:
    - CUSTOM_IMAGE_NAMESPACE=$(echo "CommonSoftware" | tr '[:upper:]' '[:lower:]')
    - CUSTOM_IMAGE_NAME=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
    - test -f $OCI_LAYOUT_PATH_AMD64/index.json
    - test -f $OCI_LAYOUT_PATH_AMD64/oci-layout
    - cat $OCI_LAYOUT_PATH_AMD64/index.json
    - regctl image copy "ocidir://$OCI_LAYOUT_PATH_AMD64:latest" "ocidir://$OCI_LAYOUT_PATH_MULTI:linux-amd64"
    - regctl index create "ocidir://$OCI_LAYOUT_PATH_MULTI:latest" --ref "ocidir://$OCI_LAYOUT_PATH_MULTI:linux-amd64" --platform linux/amd64
    - regctl image manifest "ocidir://$OCI_LAYOUT_PATH_MULTI:latest"
